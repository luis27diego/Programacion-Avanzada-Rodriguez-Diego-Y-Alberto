<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Barra de navegación -->
    <nav class="bg-blue-600 p-4">
        <div class="container mx-auto flex items-center">
            <div class="text-white text-lg font-bold mr-8">Sistema de Reclamos - Admin</div>
            <div class="flex-1 flex justify-center space-x-4">
                <a href="{{ url_for('manejar_reclamos') }}" class="px-3 py-1 rounded transition-colors duration-200 {% if active_page == 'manejar_reclamos' %}bg-white text-blue-600 font-bold{% else %}text-white hover:bg-white/20{% endif %}">Manejar Reclamos</a>
                <a href="{{ url_for('dashboard') }}" class="px-3 py-1 rounded transition-colors duration-200 {% if active_page == 'dashboard' %}bg-white text-blue-600 font-bold{% else %}text-white hover:bg-white/20{% endif %}">Dashboard</a>
                <a href="{{ url_for('ayuda') }}" class="px-3 py-1 rounded transition-colors duration-200 {% if active_page == 'ayuda' %}bg-white text-blue-600 font-bold{% else %}text-white hover:bg-white/20{% endif %}">Ayuda</a>
            </div>
            <div class="flex justify-end">
                <a href="{{ url_for('logout') }}" class="text-white hover:underline ml-8">Cerrar sesión</a>
            </div>
        </div>
    </nav>
    <!-- Contenido principal -->
    <div class="container mx-auto mt-8 p-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
