{% extends 'base.html' %}
{% block title %}Crear Reclamo{% endblock %}
{% block content %}
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md mx-auto">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                        <div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded mb-2">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <h1 class="text-2xl font-bold mb-4">Crear un nuevo reclamo</h1>
        <form method="POST">
            <div class="mb-4">
                <label for="input_contenido" class="block text-sm font-medium text-gray-700">Descripción del reclamo:</label>
                <textarea id="input_contenido" name="input_contenido" class="mt-1 block w-full border border-gray-300 rounded-md p-2" rows="4" required></textarea>
            </div>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full">
                Enviar reclamo
            </button>
        </form>
    </div>
{% endblock %}
